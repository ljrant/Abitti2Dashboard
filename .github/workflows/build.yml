name: Build Windows EXE

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "ui.html"
      - "Rakenna_ja_kaynnista.cmd"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          if (-not (Test-Path $csc)) { throw "Windows .NET Framework C# compiler was not found." }
          & $csc /nologo /target:winexe /out:AbittiHallinta.exe /resource:ui.html,AbittiHallinta.ui.html /reference:System.dll /reference:System.Core.dll /reference:System.Web.Extensions.dll /reference:System.Security.dll /reference:System.Windows.Forms.dll src\Program.Core.cs src\Program.Http.cs src\Program.WebSocket.cs src\Program.Storage.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "AbittiHallinta.exe")) { throw "EXE was not created." }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: AbittiHallinta-windows
          path: AbittiHallinta.exe
          if-no-files-found: error
